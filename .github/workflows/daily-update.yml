name: 每日更新球鞋数据

on:
  schedule:
    - cron: "0 0,8 * * *"      # 北京 8:00 和 16:00
  workflow_dispatch:

concurrency:
  group: sneaker-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 抓取数据
        run: python fetch_sneaker_data.py

      - name: 重新打包单文件看板
        run: python build_standalone.py

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data.json "EazyReview-看板-单文件版.html"
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日球鞋数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 兜底 rebase：处理网页端手动改动或极端 race
            git pull --rebase --autostash origin main || {
              echo "::warning::rebase 失败，强制以最新本地数据为准"
              git fetch origin main
              git reset --hard origin/main
              python fetch_sneaker_data.py
              python build_standalone.py
              git add data.js data.json "EazyReview-看板-单文件版.html"
              git commit -m "chore(data): 每日球鞋数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            }
            git push
          fi

      - name: 刷新 jsDelivr CDN 缓存
        if: always()
        run: |
          for f in data.js data.json "EazyReview-看板-单文件版.html"; do
            echo "::notice::purging $f ..."
            curl -sS -m 30 "https://purge.jsdelivr.net/gh/Knoewn/sneaker-board@main/${f}" \
              -w "  http=%{http_code}\n" || true
          done
